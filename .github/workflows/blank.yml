name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Greets first-time contributors (runs on Issues/PRs only)
  welcome:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' || github.event_name == 'pull_request_target'
    steps:
      - name: Greet First-Time Contributor
        uses: actions/first-interaction@v1.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "Welcome! Thank you for opening your first issue in this repository."
          pr-message: "Thank you for sending your first pull request! We appreciate your contribution."

  # Job 2: Core Build & Verification Pipeline
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Display Build Environment Info
        run: |
          echo "Triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Execute Build Script
        run: |
          echo "Starting build process..."
          # Replace this block with your actual build command, e.g., 'npm run build' or 'flutter build'
